AWSTemplateFormatVersion: '2010-09-09'
Description: EC2 con Apache desplegada desde GitHub Actions - Leonardo Geney (0192210)

Parameters:
  InstanceDescription:
    Description: Descripcion del servidor web
    Type: String
    Default: Servidor Web Apache

  InstanceName:
    Description: Nombre (tag Name) de la instancia EC2
    Type: String
    Default: EC2-Leonardo-Geney-IaC

  SecurityGroupDescription:
    Description: Security Group Description
    Type: String
    Default: Acceso HTTP al servidor

  LatestAmiId:
    Description: AMI mas reciente de Amazon Linux 2023 (se resuelve sola)
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:

  MyInstanceClase:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: t2.micro
      SecurityGroups:
        - !Ref ServerSecurityGroupClase
      Tags:
        - Key: Name
          Value: !Ref InstanceName
        - Key: Proyecto
          Value: IaC-CloudFormation-GitHub
        - Key: Estudiante
          Value: Leonardo Geney - 0192210
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          yum update -y
          yum install -y httpd
          systemctl start httpd
          systemctl enable httpd
          cat > /var/www/html/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="es">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Leonardo Geney | IaC AWS</title>
            <style>
              * { margin: 0; padding: 0; box-sizing: border-box; }
              body {
                font-family: 'Segoe UI', Arial, sans-serif;
                background: linear-gradient(135deg, #0f172a, #1e3a8a);
                color: #e2e8f0;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px;
              }
              .card {
                background: rgba(255, 255, 255, 0.06);
                border: 1px solid rgba(255, 255, 255, 0.15);
                border-radius: 16px;
                padding: 40px;
                max-width: 720px;
                width: 100%;
                box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
              }
              h1 { font-size: 2rem; color: #ffffff; margin-bottom: 6px; }
              h2 { font-size: 1.1rem; color: #fbbf24; font-weight: 500; margin-bottom: 24px; }
              .badge {
                display: inline-block;
                background: #f97316;
                color: #fff;
                padding: 4px 12px;
                border-radius: 999px;
                font-size: 0.8rem;
                margin-bottom: 18px;
              }
              table { width: 100%; border-collapse: collapse; margin: 20px 0; }
              td { padding: 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
              td:first-child { color: #94a3b8; width: 40%; }
              p { line-height: 1.6; margin-bottom: 12px; }
              .stack { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
              .stack span {
                background: #1e293b;
                border: 1px solid #334155;
                padding: 6px 12px;
                border-radius: 8px;
                font-size: 0.85rem;
              }
              a { color: #60a5fa; }
              footer { margin-top: 28px; font-size: 0.8rem; color: #94a3b8; }
            </style>
          </head>
          <body>
            <div class="card">
              <span class="badge">${InstanceDescription}</span>
              <h1>Leonardo Geney</h1>
              <h2>Hola desde CloudFormation con GitHub Actions</h2>
              <table>
                <tr><td>Código estudiantil</td><td>0192210</td></tr>
                <tr><td>Programa</td><td>Ingeniería de Sistemas</td></tr>
                <tr><td>Universidad</td><td>UFPSO - Seccional Ocaña</td></tr>
                <tr><td>Asignatura</td><td>Cloud Computing</td></tr>
                <tr><td>Docente</td><td>Wilder Andrés Duarte Neira</td></tr>
              </table>
              <p>Esta página fue publicada automáticamente en una instancia EC2 creada
                 con Infraestructura como Código: la plantilla de CloudFormation vive
                 en GitHub y GitHub Actions la despliega en AWS en cada push a main.</p>
              <div class="stack">
                <span>AWS EC2</span>
                <span>CloudFormation</span>
                <span>GitHub Actions</span>
                <span>Apache</span>
                <span>User Data</span>
              </div>
              <footer>
                Repositorio: <a href="https://github.com/leogeney/0192210-leonardo-geney-iac-aws">github.com/leogeney/0192210-leonardo-geney-iac-aws</a>
              </footer>
            </div>
          </body>
          </html>
          EOF

  ServerSecurityGroupClase:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Ref SecurityGroupDescription
      Tags:
        - Key: Name
          Value: SG-HTTP-Leonardo-Geney
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

Outputs:

  InstanceId:
    Description: ID de la instancia EC2
    Value: !Ref MyInstanceClase

  PublicIP:
    Description: IP publica de la instancia
    Value: !GetAtt MyInstanceClase.PublicIp

  WebsiteURL:
    Description: URL del sitio web
    Value: !Sub http://${MyInstanceClase.PublicIp}
